# Stub Spinnaker instances.
#
# THIS IS THE FILE YOU REPLACE to run the harness against real Gates: swap these server
# blocks for real gate/deck Services and repoint the upstream blocks in edge.conf.
#
# Each stub emulates only what the fleet routing needs:
#   * GET /                    a page naming the instance, and a Set-Cookie that stands in
#                              for Gate creating a session
#   * GET /api/v1/auth/user    a user when the session cookie is present, 401 when not
#   * GET /api/v1/health       200, like a real probe target
#
# What stubs CANNOT cover: Gate's own FleetDirectAccessFilter. Testing the non-admin
# redirect needs real Gates, and additionally needs Fiat running, because
# FiatPermissionEvaluator.isAdmin() returns true for everyone when Fiat is disabled.

# --- instance 1 --------------------------------------------------------------
server {
    listen 19001;

    location = /api/v1/health {
        return 200 "ok\n";
    }

    # A genuine upstream 500. Proves the edge's error_page 5xx handlers (which exist to
    # survive a fleet-manager outage) do NOT swallow real backend failures --
    # proxy_intercept_errors is off, so this must reach the client as a 500.
    location = /api/v1/boom {
        return 500 "upstream exploded\n";
    }

    # 401 without a session, a user with one. The 401 branch is what proves the edge does
    # not convert an UPSTREAM 401 into a picker redirect.
    location = /api/v1/auth/user {
        if ($cookie_SESSION_INST_1 = "") {
            return 401 "unauthenticated\n";
        }
        return 200 '{"username":"alice","instance":"inst-1"}';
    }

    location / {
        # Stands in for Gate minting a session. Domain is the shared parent so the cookie
        # is sent to the global URL too -- that is what makes cookie-name routing work.
        add_header Set-Cookie "SESSION_INST_1=stub-session; Path=/; Domain=.spinnaker.example.com" always;
        add_header Content-Type "text/plain" always;
        return 200 "served-by=inst-1 uri=$request_uri\n";
    }
}

# --- instance 2 --------------------------------------------------------------
server {
    listen 19002;

    location = /api/v1/health {
        return 200 "ok\n";
    }

    location = /api/v1/auth/user {
        if ($cookie_SESSION_INST_2 = "") {
            return 401 "unauthenticated\n";
        }
        return 200 '{"username":"alice","instance":"inst-2"}';
    }

    location / {
        add_header Set-Cookie "SESSION_INST_2=stub-session; Path=/; Domain=.spinnaker.example.com" always;
        add_header Content-Type "text/plain" always;
        return 200 "served-by=inst-2 uri=$request_uri\n";
    }
}
