apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-manager
spec:
  # Stateless: the assignment lives entirely in the caller's cookie, so replicas need no
  # coordination and a restart loses nothing.
  replicas: 2
  template:
    spec:
      containers:
      - name: fleet-manager
        # Not published to a registry -- this is a validation fixture, deliberately outside
        # CI. Build and load it yourself (see k8s/README.md), or override via the
        # `images:` field of a kustomization.
        image: armory/spin-fl:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        # Generated by kustomize, so the name carries a content hash and editing the
        # config rolls the pods instead of silently leaving stale ones running.
        - configMapRef:
            name: fleet-manager
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          # A static Go binary that writes nothing to disk, so it needs no writable mount
          # at all -- not even /tmp.
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      securityContext:
        # Matches the uid/gid created in the Dockerfile.
        runAsUser: 10111
        runAsGroup: 10111
        runAsNonRoot: true
