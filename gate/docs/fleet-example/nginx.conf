# Top-level nginx.conf for the fleet edge container.
#
# Deliberately minimal: all fleet logic lives in fleet-edge.conf, which this includes.
# Paths are chosen so the container can run non-root with a read-only root filesystem
# (see kubernetes.yml) -- nginx must be able to write its pid and temp dirs somewhere,
# and /tmp is the only writable mount.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Two formats on purpose. $instance is only meaningful on the global server block --
  # the per-instance blocks proxy directly and never evaluate it, so logging it there
  # would print a stale/default value and lie about where the request actually went.
  # $upstream_addr is authoritative everywhere.
  log_format fleet '$remote_addr "$request" $status '
                   'host=$host upstream=$upstream_addr rt=$request_time';
  log_format fleet_routed '$remote_addr "$request" $status '
                          'host=$host instance=$instance '
                          'upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout fleet;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Emit RELATIVE Location headers for redirects nginx generates itself (the instance
  # picker redirect, trailing-slash redirects, ...).
  #
  # This is not cosmetic. With the default (on), nginx builds absolute redirects from $host
  # plus its OWN listening port, so behind an ingress that terminates 443 and forwards to
  # 8080 the picker would redirect users to http://spinnaker.example.com:8080/... -- wrong
  # scheme, wrong port, unreachable. Relative Location headers are resolved by the browser
  # against the original URL, which preserves all three.
  #
  # Upstream redirects from Deck/Gate are unaffected either way; this only governs
  # nginx-generated ones.
  absolute_redirect off;

  # Writable paths for a read-only root filesystem.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Deck ships large JS bundles; Spinnaker pipeline payloads can be chunky.
  client_max_body_size 32m;

  include /etc/nginx/conf.d/fleet-edge.conf;
}
