# The fleet edge router: a small nginx that routes by session-cookie name.
#
# Deliberately NOT ingress-nginx annotations -- see README.md ("Why not do this with
# ingress-nginx annotations?"). The Ingress in front of this is intentionally dumb.
#
# Labels and selector are declared explicitly here rather than via kustomize's label
# transformer, because this overlay also defines per-instance Services whose selectors must
# NOT be rewritten.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spinnaker-fleet-edge
  labels:
    app.kubernetes.io/name: spinnaker-fleet-edge
spec:
  # Stateless: all routing state is in the caller's cookie.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spinnaker-fleet-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spinnaker-fleet-edge
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # Served by the default_server block in fleet-edge.conf, so it needs no Host header
        # and does not depend on any instance being up.
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        # subPath so each file lands individually and the rest of /etc/nginx is untouched.
        # The key MUST be fleet-edge.conf: nginx.conf includes that exact filename rather
        # than globbing *.conf, so that the image's own default.conf is never picked up.
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: config
          mountPath: /etc/nginx/conf.d/fleet-edge.conf
          subPath: fleet-edge.conf
          readOnly: true
        - name: config
          mountPath: /etc/nginx/fleet-proxy-headers.conf
          subPath: fleet-proxy-headers.conf
          readOnly: true
        # nginx needs somewhere writable for its pid and temp dirs; nginx.conf points all
        # of them at /tmp precisely so the root filesystem can stay read-only.
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsUser: 101 # the nginx user in the alpine image
        runAsGroup: 101
        runAsNonRoot: true
      volumes:
      - name: config
        configMap:
          # Rewritten by kustomize to the hashed name, so editing any nginx file rolls the
          # edge pods instead of leaving them serving stale config.
          name: fleet-edge
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spinnaker-fleet-edge
  labels:
    app.kubernetes.io/name: spinnaker-fleet-edge
spec:
  selector:
    app.kubernetes.io/name: spinnaker-fleet-edge
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  type: NodePort
