# ============================================================================
# Spinnaker fleet edge router -- 2 instances behind one global URL
#
#   https://spinnaker.example.com          global URL (all users)
#   https://inst-1.spinnaker.example.com   instance 1 (SAML ACS + admins only)
#   https://inst-2.spinnaker.example.com   instance 2 (SAML ACS + admins only)
#
# Gate runs with server.servlet.context-path: /api/v1, so Gate itself owns the path
# prefix and this edge passes URIs through untouched -- no rewriting, no
# X-Forwarded-Prefix. See ../fleet.md.
# ============================================================================

# ---------------------------------------------------------------------------
# http { } level
# ---------------------------------------------------------------------------

# Which instance minted this caller's session? The routing key is the cookie NAME,
# not its value, so an expired session still routes home and re-authentication stays
# on the same instance instead of scattering the user across the fleet.
#
# Anchor the pattern: an unanchored ~*SESSION_INST_1 would also match a cookie whose
# *value* happens to contain that text.
map $http_cookie $cookie_instance {
    default                     "";
    "~(^|;\s*)SESSION_INST_1="  "inst-1";
    "~(^|;\s*)SESSION_INST_2="  "inst-2";
}

# Final decision. The cookie always wins; only a cookie-less request consults the fleet
# manager.
#
# The default is a real instance rather than an error. Note that this map alone is NOT what
# makes a fleet-manager outage survivable: auth_request fails during the access phase, before
# proxy_pass is ever reached, so a cookie-less request would 500 and never consult this map.
# The @fleet_fallback error_page handler below is what actually degrades gracefully; this
# default is what that handler resolves to.
map "$cookie_instance:$assigned_instance" $instance {
    "~^inst-1:"   "inst-1";
    "~^inst-2:"   "inst-2";
    "~^:inst-1$"  "inst-1";
    "~^:inst-2$"  "inst-2";
    default       "inst-1";
}

map $instance $deck_upstream {
    "inst-2"  "deck_inst_2";
    default   "deck_inst_1";
}

map $instance $gate_upstream {
    "inst-2"  "gate_inst_2";
    default   "gate_inst_1";
}

# Honour an inbound X-Forwarded-Proto when this edge sits behind another TLS
# terminator; otherwise fall back to our own scheme.
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Tells the fleet manager whether the request it is being asked about is a browser
# navigation (which may be redirected to the instance picker) or an API call (which must
# never receive an HTML page). Derived from the original request URI because auth_request
# runs in its own internal location and does NOT inherit proxy_set_header from the parent;
# $request_uri inside a subrequest still refers to the original client request.
map $request_uri $fleet_mode {
    "~^/api/v1/"  "api";
    default       "navigate";
}

# proxy_pass with a variable normally demands a resolver -- except when the variable's
# value names a declared upstream, as it does here. Keep these names in sync with the
# maps above.
upstream deck_inst_1 { server deck-inst-1.spinnaker.svc.cluster.local:9000; keepalive 16; }
upstream deck_inst_2 { server deck-inst-2.spinnaker.svc.cluster.local:9000; keepalive 16; }
upstream gate_inst_1 { server gate-inst-1.spinnaker.svc.cluster.local:8084; keepalive 16; }
upstream gate_inst_2 { server gate-inst-2.spinnaker.svc.cluster.local:8084; keepalive 16; }
upstream fleet_manager { server fleet-manager.spinnaker.svc.cluster.local:8080; keepalive 8; }

# ---------------------------------------------------------------------------
# Default server: liveness/readiness, and a hard stop for unknown Host headers.
#
# Being the default_server means a request with an unrecognised Host gets 404 rather
# than falling through to the global block, so the fleet cannot be reached by
# Host-header guessing. It also lets the kubelet probe /healthz without spoofing a Host.
# ---------------------------------------------------------------------------
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# The global URL -- every ordinary user, every request
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name spin.managed.armory.io;

    # $instance is only computed here, so only here is it safe to log. NB it is
    # deliberately not read in the rewrite phase (e.g. via `set`): the map is evaluated
    # and then cached on first use, so reading it before auth_request has run would
    # freeze it at the default and send cookie-less users to the wrong instance.
    access_log /dev/stdout fleet_routed;

    # Never let the fleet's internal shape be cached or framed.
    proxy_buffering off;

    # Ask the fleet manager which instance to use -- but ONLY when the browser has no
    # instance cookie yet. When it does, this short-circuits to 204 without any
    # network call, so steady-state traffic has no dependency on the fleet manager.
    #
    # This covers the cookie-less window between the first Deck asset load and the
    # request that actually creates the session. Assignment must be stable across
    # that window; round-robin here causes intermittent login failures.
    location = /_fleet_assign {
        internal;

        if ($cookie_instance != "") {
            return 204;
        }

        proxy_pass http://fleet_manager/assign;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Fleet-Mode $fleet_mode;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The instance picker, served through the edge so it shares an origin (and therefore a
    # cookie scope) with the global URL.
    #
    # Deliberately has NO auth_request: the picker is what we redirect to when assignment
    # is missing, so guarding it with the very check that fails would loop forever.
    #
    # The trailing slash on proxy_pass strips the /_fleet/ prefix, so the fleet manager
    # sees /, /choose and /reset. Its forms use relative actions, so they resolve back
    # under /_fleet/ without the service needing to know the prefix.
    location /_fleet/ {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://fleet_manager/;
    }

    # Reached when /assign answered 401, i.e. nobody has chosen an instance yet.
    #
    # return=$uri passes the PATH only. $request_uri would include the query string, and
    # nginx has no URL-encoding primitive, so its "?"/"&" would corrupt this query. The
    # first-visit query string is therefore not preserved; every later request keeps it,
    # because the picker only appears once.
    location @fleet_chooser {
        return 302 /_fleet/?return=$uri;
    }

    # A fleet-manager outage must not take new users down with it.
    #
    # auth_request runs in the access phase, so if the fleet manager is unreachable nginx
    # fails the request with a 500 before proxy_pass is ever evaluated -- the $instance map's
    # default cannot save it. These handlers catch that and serve the default instance
    # instead, which is what makes an outage a degradation (everyone lands on one instance)
    # rather than an outage of its own (every new user gets a 500).
    #
    # Existing sessions are unaffected either way: /_fleet_assign short-circuits to 204 on
    # the session cookie without touching the network.
    #
    # These only catch nginx-generated 5xx. A genuine 5xx from Deck or Gate passes straight
    # through, because proxy_intercept_errors defaults to off.
    location @fleet_fallback_deck {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://$deck_upstream;
    }

    location @fleet_fallback_gate {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://$gate_upstream;
    }

    # ---- Gate ------------------------------------------------------------
    # Gate owns /api/v1 as its servlet context path, so pass the URI through
    # unchanged. proxy_pass with a variable and no URI component does exactly that.
    location /api/v1/ {
        auth_request     /_fleet_assign;
        auth_request_set $assigned_instance $upstream_http_x_spinnaker_instance;

        # Deliberately NO error_page 401 -> @fleet_chooser here. An XHR must never be
        # answered with an HTML picker, so for API traffic the fleet manager hands back a
        # default instance instead of a 401.
        #
        # Gate's own 401s (an unauthenticated API call) are untouched either way:
        # proxy_intercept_errors defaults to off, so upstream 4xx is passed straight
        # through and only an auth_request 401 is ever intercepted.
        #
        # Survive a fleet-manager outage by serving the default instance.
        error_page 500 502 503 504 = @fleet_fallback_gate;

        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://$gate_upstream;
    }

    # ---- Deck (the UI, and everything else) ------------------------------
    location / {
        auth_request     /_fleet_assign;
        auth_request_set $assigned_instance $upstream_http_x_spinnaker_instance;

        # A 401 from /assign means "nobody has picked an instance yet" -- send the browser
        # to the picker rather than showing it an error.
        error_page 401 = @fleet_chooser;

        # Survive a fleet-manager outage by serving the default instance. Without this a
        # cookie-less visitor gets a 500 for as long as the fleet manager is down.
        error_page 500 502 503 504 = @fleet_fallback_deck;

        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://$deck_upstream;
    }
}

# ---------------------------------------------------------------------------
# Instance URLs
#
# These MUST stay reachable by end-user browsers: with a per-instance SAML
# Assertion Consumer Service, the IdP posts the assertion to the instance host
# through the user's browser. That is why the admin-only rule is enforced inside Gate
# (FleetDirectAccessFilter) rather than at the network layer -- it cannot be a
# firewall rule. Gate exempts the SAML endpoints so login completes, redirects
# non-admin browser sessions back to the global URL, and lets admins through.
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name inst-1.spin.managed.armory.io;

    location /api/v1/ {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://gate_inst_1;
    }

    location / {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://deck_inst_1;
    }
}

server {
    listen 8080;
    server_name inst-2.spin.managed.armory.io;

    location /api/v1/ {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://gate_inst_2;
    }

    location / {
        include /etc/nginx/fleet-proxy-headers.conf;
        proxy_pass http://deck_inst_2;
    }
}
