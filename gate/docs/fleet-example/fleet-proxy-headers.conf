# Headers every fleet upstream must receive. Included by each proxying location in
# nginx-fleet-edge.conf so there is exactly one place to change them.

proxy_http_version 1.1;

# Host / X-Forwarded-Host are what Gate's FleetDirectAccessFilter compares against
# fleet.global-base-url to decide "did this arrive via the edge, or directly at an
# instance?". proxy_set_header REPLACES any client-supplied value, which is what makes
# the header trustworthy here -- a caller cannot smuggle their own.
proxy_set_header Host             $host;
proxy_set_header X-Forwarded-Host $host;

# $client_proto/$client_port are $scheme/$server_port normally, or the inbound
# X-Forwarded-Proto/X-Forwarded-Port when something upstream of this edge (e.g. a
# TLS-terminating Kubernetes Ingress or ALB) already terminated TLS. Getting proto wrong
# makes Gate generate http:// URLs and browsers drop the Secure session cookie; getting
# port wrong makes Gate's absolute redirects embed this edge's own internal listen port
# instead of the real one the browser used.
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_set_header X-Forwarded-Port  $client_port;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP       $remote_addr;

# Deck holds long-lived connections for execution polling.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
